# Builds AirSync (with AirSync+ enabled) from the upstream repository and
# publishes each build as a release in a PRIVATE repository.
#
# AirSync+ comes from upstream's own "AirSync Self Compiled" scheme
# (SWIFT_ACTIVE_COMPILATION_CONDITIONS = SELF_COMPILED). The project license
# only allows such builds for private use, so this workflow refuses to publish
# to a public repository. Setup instructions: .github/selfbuild/README.md

name: AirSync+ self-build

on:
  schedule:
    # Poll upstream every 20 minutes. Only a cheap Linux job runs unless
    # upstream has a commit or release that has not been built yet.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream branch, tag or commit to build (empty = latest branch head + latest release)'
        required: false
        default: ''
      force:
        description: 'Rebuild even if a release already exists or the last build of this commit failed'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: airsync-plus-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'sameerasw/airsync-mac' }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  RELEASE_REPO: ${{ vars.RELEASE_REPO }}

jobs:
  detect:
    name: Check upstream for new commits
    runs-on: ubuntu-latest
    permissions:
      contents: write # optional fork sync
      actions: read   # look up failed-build markers in the cache
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Check release repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the RELEASE_REPO variable and the RELEASE_TOKEN secret. See .github/selfbuild/README.md."
            exit 1
          fi
          private=$(gh repo view "$RELEASE_REPO" --json isPrivate --jq .isPrivate)
          if [ "$private" != "true" ]; then
            echo "::error::$RELEASE_REPO is not private. Self-compiled AirSync+ builds may not be published publicly (see LICENSE)."
            exit 1
          fi

      - name: Sync this fork with upstream
        if: vars.SYNC_FORK == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch="$branch" --jq '"Fork sync: \(.merge_type) – \(.message)"'; then
            echo "::warning::Fork sync failed (a merge conflict, or upstream changed workflow files, which GITHUB_TOKEN cannot push). Use 'Sync fork' in the GitHub UI."
          fi

      - name: Plan builds
        id: plan
        env:
          UP_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          MACOS_RUNNER: ${{ vars.MACOS_RUNNER }}
        run: |
          set -euo pipefail
          up()  { GH_TOKEN="$UP_TOKEN" gh api "$@"; }
          rel() { GH_TOKEN="$RELEASE_TOKEN" gh "$@"; }

          # Upstream tags, used to tell release commits from plain branch commits.
          tags=$(up "repos/$UPSTREAM_REPO/tags?per_page=100" --jq '[.[] | {name, sha: .commit.sha}]')

          candidates=()
          if [ -n "$INPUT_REF" ]; then
            candidates+=("$(up "repos/$UPSTREAM_REPO/commits/$INPUT_REF" --jq .sha)")
          else
            # Latest upstream release first, then the branch head, so release
            # notes of the head build list the changes since that release.
            latest_tag=$(up "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [ -n "$latest_tag" ]; then
              candidates+=("$(jq -r --arg t "$latest_tag" '.[] | select(.name == $t) | .sha' <<<"$tags")")
            fi
            candidates+=("$(up "repos/$UPSTREAM_REPO/commits/$UPSTREAM_BRANCH" --jq .sha)")
          fi

          plan='[]'
          for sha in $(printf '%s\n' "${candidates[@]}" | grep . | awk '!seen[$0]++'); do
            short=${sha:0:7}
            upstream_tag=$(jq -r --arg s "$sha" '[.[] | select(.sha == $s) | .name][0] // ""' <<<"$tags")
            pbxproj=$(up "repos/$UPSTREAM_REPO/contents/AirSync.xcodeproj/project.pbxproj?ref=$sha" \
                        -H 'Accept: application/vnd.github.raw')
            version=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' <<<"$pbxproj" | sort -V | tail -1)
            # A deployment target of macOS N needs the macOS N SDK, i.e. Xcode N.
            # GitHub names its Xcode 27+ images by Xcode version (xcode-27, ...).
            xcode=$(sed -n 's/.*MACOSX_DEPLOYMENT_TARGET = \([0-9]*\).*/\1/p' <<<"$pbxproj" | sort -n | tail -1)
            if [ "${xcode:-0}" -ge 27 ]; then runner="xcode-$xcode"; else runner=macos-26; fi
            runner=${MACOS_RUNNER:-$runner}
            tag="v${version}-${short}"
            # Upstream marks betas with a suffix such as v2.0.27-BETA.
            stable=false
            if [ -n "$upstream_tag" ] && [[ "$upstream_tag" != *-* ]]; then stable=true; fi

            existing=$(rel release view "$tag" -R "$RELEASE_REPO" --json isPrerelease --jq .isPrerelease 2>/dev/null || echo missing)
            if [ "$existing" != missing ] && [ "$FORCE" != true ]; then
              if [ "$stable" = true ] && [ "$existing" = true ]; then
                echo "Upstream tagged $upstream_tag at $short; promoting existing build $tag"
                rel release edit "$tag" -R "$RELEASE_REPO" --prerelease=false --latest --title "AirSync+ $upstream_tag"
                if [ -n "$NTFY_URL" ]; then
                  curl -fsS ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} -H "Title: AirSync+ $upstream_tag" \
                    -H "Tags: package" -H "Click: https://github.com/$RELEASE_REPO/releases/tag/$tag" \
                    -d "Upstream released $upstream_tag; build $tag is now the latest release." "$NTFY_URL" || true
                fi
              else
                echo "Already built: $tag"
              fi
              continue
            fi

            if [ "$FORCE" != true ]; then
              failed=$(GH_TOKEN="$UP_TOKEN" gh cache list -R "$GITHUB_REPOSITORY" --key "airsync-failed-$sha" --json key --jq length)
              if [ "$failed" != 0 ]; then
                echo "::notice::Skipping $short: its last build failed. Run the workflow manually with 'force' to retry."
                continue
              fi
            fi

            echo "Will build $tag on $runner (upstream tag: ${upstream_tag:-none})"
            plan=$(jq -c --arg sha "$sha" --arg short "$short" --arg version "$version" --arg tag "$tag" \
                         --arg upstream_tag "$upstream_tag" --arg stable "$stable" --arg runner "$runner" \
                   '. + [{sha: $sha, short: $short, version: $version, tag: $tag, upstream_tag: $upstream_tag, stable: $stable, runner: $runner}]' <<<"$plan")
          done

          echo "matrix={\"include\":$plan}" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<<"$plan")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.tag }}
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      SHA: ${{ matrix.sha }}
      SHORT: ${{ matrix.short }}
      VERSION: ${{ matrix.version }}
      TAG: ${{ matrix.tag }}
      UPSTREAM_TAG: ${{ matrix.upstream_tag }}
      STABLE: ${{ matrix.stable }}
      SRC: ${{ github.workspace }}/src
      OUT: ${{ github.workspace }}/out
      DERIVED: ${{ github.workspace }}/build
    steps:
      - name: Check out upstream ${{ matrix.short }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ matrix.sha }}
          path: src
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION || 'latest-stable' }}

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/spm
          key: spm-${{ hashFiles('src/AirSync.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      # The app checks upstream's Sparkle feed on every launch, which would offer
      # to replace this build with the official one (AirSync+ off). Point it at
      # an empty feed in this fork instead.
      - name: Point Sparkle at the self-build feed
        env:
          FEED_URL: ${{ vars.SPARKLE_FEED_URL || format('https://raw.githubusercontent.com/{0}/{1}/.github/selfbuild/appcast.xml', github.repository, github.event.repository.default_branch || 'main') }}
        run: /usr/libexec/PlistBuddy -c "Set :SUFeedURL $FEED_URL" "$SRC/airsync-mac/Info.plist"

      - name: Build (AirSync Self Compiled scheme)
        id: build
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild build \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -configuration "Self Compiled" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/spm" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log" | xcbeautify --renderer github-actions

      # No Apple Developer account is involved, so sign ad hoc. Hardened runtime
      # is left off: it only matters for notarization and breaks library
      # validation between ad-hoc signed binaries.
      - name: Sign ad hoc
        run: |
          set -euo pipefail
          APP="$DERIVED/Build/Products/Self Compiled/AirSync.app"
          test -d "$APP"
          widget_ent="$RUNNER_TEMP/widget.entitlements"
          cp "$SRC/AirSyncWidgetExtension.entitlements" "$widget_ent"
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.app-sandbox bool true" "$widget_ent"

          codesign --force --deep --sign - "$APP"
          for ext in "$APP"/Contents/PlugIns/*.appex; do
            [ -e "$ext" ] && codesign --force --sign - --entitlements "$widget_ent" "$ext"
          done
          codesign --force --sign - --entitlements "$SRC/AirSync.entitlements" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package DMG
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" "$OUT"
          cp -R "$APP" "$stage/"
          ln -s /Applications "$stage/Applications"
          # hdiutil occasionally fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3; do
            hdiutil create -volname AirSync -srcfolder "$stage" -ov -format UDZO "$OUT/AirSync.dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          (cd "$OUT" && shasum -a 256 AirSync.dmg > AirSync.dmg.sha256)

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          prev=$(GH_TOKEN="$RELEASE_TOKEN" gh release list -R "$RELEASE_REPO" --limit 20 --json tagName \
                   --jq "[.[].tagName | select(. != \"$TAG\")][0] // \"\"")
          prev_sha=${prev##*-}
          # shellcheck disable=SC2016 # single quotes hold jq and markdown, not shell
          {
            echo "Built from [\`$UPSTREAM_REPO@$SHORT\`](https://github.com/$UPSTREAM_REPO/commit/$SHA)${UPSTREAM_TAG:+ (upstream release [\`$UPSTREAM_TAG\`](https://github.com/$UPSTREAM_REPO/releases/tag/$UPSTREAM_TAG))}"
            echo "with the upstream **AirSync Self Compiled** scheme, so AirSync+ is enabled. Ad-hoc signed. For private use only."
            echo
            changes=""
            if [ -n "$prev_sha" ] && [ "$prev_sha" != "$SHORT" ]; then
              changes=$(gh api "repos/$UPSTREAM_REPO/compare/$prev_sha...$SHA" \
                --jq '.commits | reverse | .[:50][] | "- \(.commit.message | split("\n")[0]) (`\(.sha[0:7])`)"' 2>/dev/null \
                || echo "- [Compare on GitHub](https://github.com/$UPSTREAM_REPO/compare/$prev_sha...$SHA)")
            fi
            if [ -n "$changes" ]; then
              echo "### Upstream changes since \`$prev\`"
              echo "$changes"
              echo
            fi
            echo "### Install"
            echo "Open the DMG and drag AirSync to Applications. The build is not notarized, so remove the quarantine flag once:"
            echo '```'
            echo 'xattr -dr com.apple.quarantine /Applications/AirSync.app'
            echo '```'
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$OUT/AirSync.dmg.sha256")\`"
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          files=("$OUT/AirSync.dmg" "$OUT/AirSync.dmg.sha256")
          if [ "$STABLE" = true ]; then
            title="AirSync+ $UPSTREAM_TAG"
            flags=(--latest)
          else
            title="AirSync+ $VERSION ($SHORT)"
            flags=(--prerelease --latest=false)
          fi
          if gh release view "$TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" -R "$RELEASE_REPO" --clobber
            gh release edit "$TAG" -R "$RELEASE_REPO" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" "${files[@]}" -R "$RELEASE_REPO" \
              --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
          echo "RELEASE_URL=https://github.com/$RELEASE_REPO/releases/tag/$TAG" >> "$GITHUB_ENV"

      - name: Prune old pre-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          KEEP: ${{ vars.KEEP_PRERELEASES || '15' }}
        run: |
          gh release list -R "$RELEASE_REPO" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[$KEEP:][] | .tagName" \
          | while read -r old; do
              echo "Deleting $old"
              gh release delete "$old" -R "$RELEASE_REPO" --yes --cleanup-tag
            done

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.short }}
          path: build.log
          if-no-files-found: ignore

      # Remember a compile failure so the 20-minute poll doesn't rebuild a
      # broken upstream commit over and over. A manual run with 'force' retries it.
      - name: Mark commit as failed
        if: failure() && steps.build.outcome == 'failure'
        run: echo "$GITHUB_RUN_ID" > "$RUNNER_TEMP/failed-marker"
      - name: Save failure marker
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/failed-marker
          key: airsync-failed-${{ matrix.sha }}

      - name: Notify
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NTFY_URL" ] && exit 0
          if [ "$STATUS" = success ]; then
            title="AirSync+ $TAG built"; tags=white_check_mark; click="$RELEASE_URL"
            msg="New upstream commit $SHORT built and released${UPSTREAM_TAG:+ (upstream $UPSTREAM_TAG)}."
          else
            title="AirSync+ $TAG build $STATUS"; tags=x; click="$RUN_URL"
            msg="Building upstream commit $SHORT failed. Open the run for the log."
          fi
          curl -fsS ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} \
            -H "Title: $title" -H "Tags: $tags" -H "Click: $click" -d "$msg" "$NTFY_URL" || true
